@root.tenants.acme+all = root.tenants.acme/app root.tenants.acme/lib/core
@root.tenants.acme+maintainers = alice carol
@root.tenants.acme+devs = alice bob
@staff = dave

repo @all
    R = @staff

repo sandbox/[a-z]+
    C = @staff
    RW+ = CREATOR

repo root.tenants.acme/app
    RW+ = @root.tenants.acme+maintainers
    - main = @root.tenants.acme+devs
    RWCD refs/heads/feature/ = @root.tenants.acme+devs
    R = @all
    config gitolite-options.deny-rules = 1
    config gitweb.description = the acme application
    config hooks.mailinglist = acme@example.com

repo root.tenants.acme/lib/core
    RW = @root.tenants.acme+devs
