apiVersion: v1
kind: Namespace
metadata:
  name: heimstatt
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned
  namespace: heimstatt
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: heimstatt-serving
  namespace: heimstatt
spec:
  secretName: heimstatt-serving
  issuerRef:
    name: selfsigned
    kind: Issuer
  dnsNames:
  - '*.heimstatt.127-0-0-1.sslip.io'
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: heimstatt
  namespace: heimstatt
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        patch:
          value:
            spec:
              ports:
              - port: 443
                protocol: TCP
                nodePort: 30443
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: heimstatt
  namespace: heimstatt
spec:
  gatewayClassName: heimstatt
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: heimstatt
  listeners:
  - name: https
    hostname: '*.heimstatt.127-0-0-1.sslip.io'
    port: 443
    protocol: HTTPS
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
      - group: ""
        kind: Secret
        name: heimstatt-serving
