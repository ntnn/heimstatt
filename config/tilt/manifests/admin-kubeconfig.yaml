apiVersion: operator.kcp.io/v1alpha1
kind: Kubeconfig
metadata:
  name: admin
spec:
  target:
    frontProxyRef:
      name: heimstatt
  targetWorkspace: root
  username: admin
  groups:
  - system:kcp:admin
  validity: 8766h
  secretRef:
    name: heimstatt-admin-kubeconfig
  authorization:
    clusterRoleBindings:
      clusterRoles:
      - cluster-admin
