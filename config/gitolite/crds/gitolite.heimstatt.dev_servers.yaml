---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: servers.gitolite.heimstatt.dev
spec:
  group: gitolite.heimstatt.dev
  names:
    kind: Server
    listKind: ServerList
    plural: servers
    singular: server
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Server is the configuration of the gitolite instance. It lives in the
          workspace of the operator and is not part of the exported API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ServerSpec is the gitolite rc of the instance.
            properties:
              adminUser:
                description: AdminUser is the user gitolite is set up with.
                type: string
              enable:
                description: Enable are the commands and features of ENABLE.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              gitConfigKeys:
                description: |-
                  GitConfigKeys are the regexes of GIT_CONFIG_KEYS a repository's git
                  config names have to match. Empty turns per-repository git config off.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              httpAnonUser:
                description: HTTPAnonUser is gitolite's HTTP_ANON_USER.
                type: string
              localCode:
                description: LocalCode is gitolite's LOCAL_CODE.
                type: string
              ownerRolename:
                description: OwnerRolename is gitolite's OWNER_ROLENAME.
                type: string
              rcExtra:
                description: RCExtra is perl appended to the rc as written.
                type: string
              roles:
                description: Roles are the role names of ROLES.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              umask:
                description: Umask is gitolite's UMASK, in octal.
                pattern: ^0[0-7]{3}$
                type: string
            type: object
          status:
            description: Status is what the operator observed of the instance.
            properties:
              conditions:
                description: Conditions carry why the configuration is not compiled,
                  in detail.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              configHash:
                description: ConfigHash is the hash of the configuration gitolite
                  last compiled.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation the conditions were
                  computed from.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: the only server is named gitolite
          reason: FieldValueInvalid
          rule: self.metadata.name == 'gitolite'
    served: true
    storage: true
    subresources:
      status: {}
