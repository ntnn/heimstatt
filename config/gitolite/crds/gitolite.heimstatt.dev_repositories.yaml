---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: repositories.gitolite.heimstatt.dev
spec:
  group: gitolite.heimstatt.dev
  names:
    kind: Repository
    listKind: RepositoryList
    plural: repositories
    singular: repository
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Repository is one gitolite repository.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RepositorySpec is the gitolite configuration of one repository.
            properties:
              description:
                description: Description is free text about what the repository is
                  for.
                pattern: ^[^`~#$&()|;<>[:cntrl:]]*$
                type: string
              gitConfig:
                additionalProperties:
                  description: RepositoryConfigValue is the value of an option or
                    a git config.
                  pattern: ^[^`~#$&()|;<>[:cntrl:]]*$
                  type: string
                description: GitConfig are gitolite "config" lines keyed by git config
                  name.
                type: object
                x-kubernetes-validations:
                - message: git config names are letters, digits, dashes, underscores
                    and dots
                  rule: self.all(key, key.matches('^[0-9a-zA-Z][-0-9a-zA-Z_.]*$'))
              name:
                description: |-
                  Name is the repository name and may contain slashes.

                  Through the tenant export it renders below the workspace path, so
                  that "a/b" in "root:tenants:acme" is "root.tenants.acme/a/b".

                  Through the admin export it renders as written.
                minLength: 1
                pattern: ^@?[\[0-9a-zA-Z][-0-9a-zA-Z._@/+\\^$|()\[\]*?{},]*$
                type: string
                x-kubernetes-validations:
                - message: the name is given without the .git suffix
                  rule: '!self.endsWith(''.git'')'
              options:
                additionalProperties:
                  description: RepositoryConfigValue is the value of an option or
                    a git config.
                  pattern: ^[^`~#$&()|;<>[:cntrl:]]*$
                  type: string
                description: Options are gitolite "option" lines keyed by option name.
                type: object
                x-kubernetes-validations:
                - message: option names are letters, digits, dashes, underscores and
                    dots
                  rule: self.all(key, key.matches('^[0-9a-zA-Z][-0-9a-zA-Z_.]*$'))
              rules:
                description: Rules are the access rules in gitolite's order, first
                  match wins.
                items:
                  description: RepositoryRule is one gitolite access rule.
                  properties:
                    denied:
                      description: Denied makes the rule a deny rather than a grant.
                      type: boolean
                    permission:
                      description: |-
                        Permission is the gitolite permission, one of "-", "R", "RW", "RW+",
                        and their "C", "D", "M" additions.
                      enum:
                      - '-'
                      - C
                      - R
                      - RW
                      - RWC
                      - RWD
                      - RWCD
                      - RWDC
                      - RWM
                      - RWCM
                      - RWDM
                      - RWCDM
                      - RWDCM
                      - RW+
                      - RW+C
                      - RW+D
                      - RW+CD
                      - RW+DC
                      - RW+M
                      - RW+CM
                      - RW+DM
                      - RW+CDM
                      - RW+DCM
                      type: string
                    refs:
                      description: Refs restricts the rule to refname regexes; empty
                        means every ref.
                      items:
                        pattern: ^[-0-9a-zA-Z._/+\\^$|()\[\]*?{},]+$
                        type: string
                      type: array
                    subjects:
                      description: |-
                        Subjects are gitolite users, groups and UMLs.

                        Through the tenant export a group named here is always the
                        caller's: "@team" is rewritten to "@root.tenants.acme+team" and
                        "@all" to the group of the caller's own repositories.

                        Through the admin export subjects render as written.
                      items:
                        pattern: ^@?[0-9a-zA-Z][-0-9a-zA-Z._@+]*$
                        type: string
                      minItems: 1
                      type: array
                  required:
                  - permission
                  - subjects
                  type: object
                minItems: 1
                type: array
            required:
            - name
            - rules
            type: object
          status:
            description: Status is what the operator observed of this repository.
            properties:
              cloneURL:
                description: CloneURL is the address to clone the repository from.
                type: string
              conditions:
                description: Conditions carry why the object is not projected, in
                  detail.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedConfigHash:
                description: |-
                  ObservedConfigHash is the hash of the compiled configuration Path came
                  out of.
                type: string
              path:
                description: Path is the qualified name the compiler rendered.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
