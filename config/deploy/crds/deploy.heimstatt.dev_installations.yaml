---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: installations.deploy.heimstatt.dev
spec:
  group: deploy.heimstatt.dev
  names:
    kind: Installation
    listKind: InstallationList
    plural: installations
    shortNames:
    - inst
    singular: installation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Installation is one heimstatt deployment.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: InstallationSpec is the whole configuration of one heimstatt
              deployment.
            properties:
              domainBase:
                description: DomainBase is the DNS suffix for heimstatt components.
                minLength: 1
                type: string
              kcp:
                description: Kcp configures how kcp is deployed.
                properties:
                  shards:
                    description: Shards are the kcp shards. Exactly one must be named
                      root.
                    items:
                      description: Shard is one kcp shard.
                      properties:
                        etcd:
                          description: |-
                            Etcd is the storage this shard writes to.
                            The prefix is automatically the name.
                          properties:
                            endpoints:
                              description: Endpoints are etcd client URLs, e.g. https://etcd.heimstatt.svc.cluster.local:2379.
                              items:
                                type: string
                              minItems: 1
                              type: array
                            tlsSecretRef:
                              description: |-
                                TLSSecretRef is the Secret with the material to reach etcd over TLS.
                                A CA bundle under ca.crt and, if the etcd requires it, tls.crt and tls.key.
                              properties:
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                              type: object
                              x-kubernetes-map-type: atomic
                          required:
                          - endpoints
                          type: object
                        name:
                          description: Name is the shard's name in kcp.
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        replicas:
                          description: |-
                            Replicas is how many replicas are configured. nil leaves the
                            kcp-operator default.
                          format: int32
                          minimum: 1
                          type: integer
                      required:
                      - etcd
                      - name
                      type: object
                    minItems: 1
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                    x-kubernetes-validations:
                    - message: exactly one shard must be named root
                      rule: self.filter(s, s.name == 'root').size() == 1
                required:
                - shards
                type: object
              oidc:
                description: OIDC configures OpenID Connect Authentication.
                properties:
                  caFileRef:
                    description: CAFileRef is the CA bundle for the OIDC provider.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  clientID:
                    description: ClientID is the OIDC client id.
                    type: string
                  issuerURL:
