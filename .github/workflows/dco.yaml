name: DCO

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions: {}

jobs:
  dco:
    name: Signed-off-by on every commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the pull request merge ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check sign-offs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
              author=$(git log -1 --format='%an' "${sha}")
              email=$(git log -1 --format='%ae' "${sha}")
              # skip bots for the dco check
              case "${author}|${email}" in
                  *'[bot]'*)
                      echo "commit ${sha}: skipping bot commit by ${author}"
                      continue ;;
              esac
              # The email is what the DCO certifies; display names vary across forges.
              if git log -1 --format='%B' "${sha}" | grep -i '^signed-off-by:' | grep -qiF "<${email}>"; then
                  continue
              fi
              echo "commit ${sha}: no Signed-off-by trailer for ${email}"
              fail=1
          done
          if [ "${fail}" -ne 0 ]; then
              echo "::error::Every commit needs a Signed-off-by trailer matching its author. Sign with 'git commit -s'. See https://developercertificate.org."
              exit 1
          fi
